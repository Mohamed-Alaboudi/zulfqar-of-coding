# Machine-readable provenance ledger.
#
# relationship values:
#   pointer       — this toolkit references/recommends installing the upstream
#                    bundle directly; nothing is vendored or copied here.
#   derived       — a shipped file in this repo is adapted from upstream code
#                    (same underlying logic, not a fresh implementation).
#   reimplemented — a shipped file in this repo implements the same upstream
#                    *pattern/idea* via original code, not a code copy.
#
# See docs/CREDITS-AND-UPSTREAM.md for pointer bundles (full detail + license
# notes) and THIRD-PARTY-NOTICES.md for derived/reimplemented shipped
# artifacts (full detail + MIT license text).

