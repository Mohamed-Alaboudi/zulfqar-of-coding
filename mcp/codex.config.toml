# Codex MCP server config — the same seven servers as claude-code.mcp.json,
# expressed as Codex [mcp_servers.*] TOML entries.
#
# Add with either:
#   codex mcp add context7 --url https://mcp.context7.com/mcp
#   codex mcp add openaiDeveloperDocs --url https://developers.openai.com/mcp
#   codex mcp add duckduckgo -- uvx duckduckgo-mcp-server==0.5.0
#   codex mcp add serena -- serena start-mcp-server
#   codex mcp add playwright -- npx @playwright/mcp@0.0.78
#
# Paste the keyed Exa and Firecrawl blocks below into ~/.codex/config.toml so
# Codex forwards named environment variables without storing their values.

[mcp_servers.context7]
url = "https://mcp.context7.com/mcp"

[mcp_servers.openaiDeveloperDocs]
url = "https://developers.openai.com/mcp"

[mcp_servers.duckduckgo]
command = "uvx"
args = ["duckduckgo-mcp-server==0.5.0"]

[mcp_servers.serena]
command = "serena"
args = ["start-mcp-server"]

[mcp_servers.exa]
url = "https://mcp.exa.ai/mcp"

[mcp_servers.exa.env_http_headers]
x-api-key = "EXA_API_KEY"

[mcp_servers.firecrawl]
command = "npx"
args = ["-y", "firecrawl-mcp@3.22.3"]

env_vars = ["FIRECRAWL_API_KEY"]

[mcp_servers.playwright]
command = "npx"
args = ["@playwright/mcp@0.0.78"]

# playwright note: first run opens an interactive browser session for auth/
# trust prompts — run it once locally before relying on it headless in CI.
